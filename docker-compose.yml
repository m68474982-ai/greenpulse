version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: ecoshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecoshield
      POSTGRES_PASSWORD: ecoshield123
      POSTGRES_DB: ecoshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoshield -d ecoshield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # EcoShield AI FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoshield-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ecoshield:ecoshield123@postgres:5432/ecoshield_db
      DATABASE_URL_SYNC: postgresql://ecoshield:ecoshield123@postgres:5432/ecoshield_db
      SECRET_KEY: ecoshield-super-secret-key-change-in-production-2024
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
    ports:
      - "8000:8000"

  # EcoShield AI Frontend (Vite + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecoshield-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Optional Mosquitto MQTT Broker for Physical ESP32 Hardware
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ecoshield-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"

volumes:
  postgres_data:
